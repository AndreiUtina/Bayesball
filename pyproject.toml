[project]
name = "bayesball"
version = "0.1.0"
description = "Bayesian rating and match prediction for foosball (and other games)"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "fastapi>=0.142.2",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "numpy>=2.5.3",
    "psycopg[binary]>=3.3.6",
    "python-multipart>=0.0.32",
    "scipy>=1.18.1",
    "sqlmodel>=0.0.47",
    "tzdata>=2026.5",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
