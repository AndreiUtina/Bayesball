{% extends "base.html" %}
{% block title %}Log in · Bayesball{% endblock %}
{% block content %}
<article class="narrow">
  <h1>Log in</h1>
  <p class="muted"><small>Only admins need to log in: everyone can view the site.</small></p>

  {% if error %}<p class="notice error">{{ error }}</p>{% endif %}

  <form method="post" action="/login">
    <input type="hidden" name="next" value="{{ next }}">
    <label>Username
      <input name="username" value="{{ username }}" required autocomplete="username" autofocus>
    </label>
    <label>Password
      <input type="password" name="password" required autocomplete="current-password">
    </label>
    <button type="submit">Log in</button>
  </form>
</article>
{% endblock %}
