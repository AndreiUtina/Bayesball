# Render Blueprint (https://render.com/docs/blueprint-spec).
# In Render: New → Blueprint → pick this repository. Render asks once for DATABASE_URL.
services:
  - type: web
    name: bayesball
    runtime: docker
    plan: free
    region: frankfurt # same region as the Neon database
    branch: main
    healthCheckPath: /health
    autoDeployTrigger: checksPass # deploy every push to main, once GitHub Actions passes
    envVars:
      - key: DATABASE_URL # the Neon connection string (direct, without "-pooler")
        sync: false
      - key: SECRET_KEY # signs login cookies; Render makes a random one
        generateValue: true
      - key: SECURE_COOKIES
        value: "true"
      - key: TIMEZONE # for times typed into the forms
        value: Europe/Amsterdam
