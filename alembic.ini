# Database migrations (https://alembic.sqlalchemy.org). The app runs them itself at startup;
# the database address comes from DATABASE_URL (see app/config.py), not from this file.
#
#   uv run alembic revision --autogenerate -m "what changed"   # after changing app/models.py
#   uv run alembic upgrade head                                # apply them by hand (optional)

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s
path_separator = os

[post_write_hooks]
# Format new migration files like the rest of the code.
hooks = ruff_fix, ruff_format
ruff_fix.type = exec
ruff_fix.executable = ruff
ruff_fix.options = check --fix --quiet REVISION_SCRIPT_FILENAME
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format --quiet REVISION_SCRIPT_FILENAME
